spring:
  application:
    name: reflectoflow-backend

logging:
  level:
    root: INFO
---
# Local development only. Activate with: SPRING_PROFILES_ACTIVE=dev
# (IntelliJ: Run configuration > Active profiles: dev)
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

server:
  error:
    include-message: always

logging:
  level:
    com.mylvy.reflectoflow: DEBUG
    org.hibernate.SQL: DEBUG
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:reflectoflow}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Tests use H2 with create-drop, so the Postgres migrations must not run
  flyway:
    enabled: false

  sql:
    init:
      mode: never