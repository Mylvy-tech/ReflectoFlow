name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          line = root.find("counter[@type='LINE']")
          missed, covered = int(line.get("missed")), int(line.get("covered"))
          total = missed + covered
          pct = 100 * covered / total if total else 0
          print(f"Backend line coverage: {pct:.1f}% ({covered}/{total} lines)")
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco